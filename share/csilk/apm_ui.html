<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>csilk APM Tracing & eBPF Dashboard</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --text: #f8fafc; }
        body { margin: 0; font-family: monospace; background: var(--bg); color: var(--text); padding: 24px; }
        h1 { color: var(--accent); margin-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--panel); padding: 16px; border-radius: 8px; border: 1px solid #334155; }
        .card .value { font-size: 24px; font-weight: bold; color: var(--accent); }
        .table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
        .table th, .table td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        .table th { background: #0f172a; color: var(--accent); }
    </style>
</head>
<body>
    <h1>⚡ csilk APM & eBPF Control Plane</h1>
    <p>Real-Time OpenTelemetry Distributed Tracing Waterfall & Kernel Drop Counter</p>
    <div class="grid">
        <div class="card"><div>Total Spans Collected</div><div class="value" id="spanCount">0</div></div>
        <div class="card"><div>eBPF Dropped Packets</div><div class="value" id="dropCount">0</div></div>
        <div class="card"><div>P95 Latency</div><div class="value" id="p95Latency">0.42 ms</div></div>
    </div>
    <table class="table">
        <thead>
            <tr><th>Trace ID</th><th>Span ID</th><th>Parent Span ID</th><th>Operation Name</th><th>Duration (ms)</th><th>Status</th></tr>
        </thead>
        <tbody id="spanList">
            <tr><td>-</td><td>-</td><td>-</td><td>Loading spans...</td><td>0.00 ms</td><td><span>INIT</span></td></tr>
        </tbody>
    </table>
    <script>
        async function refreshSpans() {
            try {
                const base = window.location.pathname.replace(/\/+$/, '');
                const res = await fetch(base + '/spans');
                if (!res.ok) return;
                const spans = await res.json();
                document.getElementById('spanCount').textContent = spans.length;
                const tbody = document.getElementById('spanList');
                if (spans.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8">No spans recorded yet</td></tr>';
                    return;
                }
                let durations = [];
                let rows = '';
                for (let i = spans.length - 1; i >= 0; i--) {
                    const s = spans[i];
                    durations.push(s.durationMs || 0);
                    const stColor = s.statusCode === 1 ? '#4ade80' : (s.statusCode === 2 ? '#ef4444' : '#94a3b8');
                    const stText = s.statusCode === 1 ? 'OK' : (s.statusCode === 2 ? 'ERROR' : 'UNSET');
                    rows += `<tr><td>${s.traceId.slice(0, 16)}...</td><td>${s.spanId}</td><td>${s.parentSpanId || '-'}</td><td>${s.name}</td><td>${(s.durationMs || 0).toFixed(2)} ms</td><td><span style="color:${stColor}">${stText}</span></td></tr>`;
                }
                tbody.innerHTML = rows;
                durations.sort((a, b) => a - b);
                const p95 = durations.length > 0 ? durations[Math.floor(durations.length * 0.95)] : 0;
                document.getElementById('p95Latency').textContent = p95.toFixed(2) + ' ms';
            } catch (e) {}
        }
        refreshSpans();
        setInterval(refreshSpans, 2000);
    </script>
</body>
</html>
