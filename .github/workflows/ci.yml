name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
        build_type: [Debug, Release]
      fail-fast: false

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-${{ matrix.build_type }}-v3-clang-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-v3-clang-deps-

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/ccache
          ~/Library/Caches/ccache
        key: ${{ runner.os }}-${{ matrix.build_type }}-v3-clang-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.build_type }}-v3-clang-ccache-

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang clang-tidy ccache \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev \
          default-libmysqlclient-dev libhiredis-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
      run: |
        brew install cmake pkg-config llvm libyaml zlib curl openssl libpq sqlite3 ccache libuv

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build -S . \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_AR=$(which llvm-ar-18 2>/dev/null || which llvm-ar 2>/dev/null || echo ar) \
          -DCMAKE_RANLIB=$(which llvm-ranlib-18 2>/dev/null || which llvm-ranlib 2>/dev/null || echo ranlib) \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DENABLE_OOM_TEST=ON \
          -DCSILK_BUILD_SHARED=ON \
          ${{ matrix.build_type == 'Debug' && '-DUSE_ASAN=ON' || '' }}

    - name: Configure (macOS)
      if: runner.os == 'macOS'
      run: |
        BREW_PREFIX=$(brew --prefix)
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=$(brew --prefix llvm)/bin/clang \
          -DCMAKE_PREFIX_PATH="${BREW_PREFIX};${BREW_PREFIX}/opt/openssl;${BREW_PREFIX}/opt/libyaml;${BREW_PREFIX}/opt/zlib;${BREW_PREFIX}/opt/curl;${BREW_PREFIX}/opt/sqlite3" \
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
          -DENABLE_OOM_TEST=ON \
          -DCSILK_BUILD_SHARED=ON \
          ${{ matrix.build_type == 'Debug' && '-DUSE_ASAN=ON' || '' }}

    - name: Build
      run: cmake --build build -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 4)

    - name: Run unit tests
      run: |
        if ! ctest --test-dir build -E test_integration --timeout 60 --output-on-failure; then
          if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            while IFS=: read -r num name; do
              err_msg=$(grep -A 25 "Test: $name" build/Testing/Temporary/LastTest.log 2>/dev/null | grep -E "Assertion|assert|error|fail|SIG|fault" | head -n 3 | tr '\n' ' ')
              echo "::error title=Failed Test $num: $name::$name failed: ${err_msg:-check LastTest.log}"
            done < build/Testing/Temporary/LastTestsFailed.log
          fi
          exit 1
        fi
      env:
        ASAN_OPTIONS: detect_leaks=${{ runner.os == 'Linux' && '1' || '0' }}:symbolize=1:abort_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions

    - name: Run integration tests
      run: |
        if ! ctest --test-dir build -R test_integration --timeout 120 --output-on-failure; then
          if [ -f build/Testing/Temporary/LastTestsFailed.log ]; then
            while IFS=: read -r num name; do
              err_msg=$(grep -A 25 "Test: $name" build/Testing/Temporary/LastTest.log 2>/dev/null | grep -E "Assertion|assert|error|fail|SIG|fault" | head -n 3 | tr '\n' ' ')
              echo "::error title=Failed Integration Test $num: $name::$name failed: ${err_msg:-check LastTest.log}"
            done < build/Testing/Temporary/LastTestsFailed.log
          fi
          exit 1
        fi
      env:
        ASAN_OPTIONS: detect_leaks=${{ runner.os == 'Linux' && '1' || '0' }}:symbolize=1:abort_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions

    - name: Run Python integration tests
      if: matrix.build_type == 'Release' || runner.os == 'Linux'
      run: |
        if [ "${{ matrix.build_type }}" = "Debug" ]; then
          if [ "${{ runner.os }}" = "Linux" ]; then
            export LD_PRELOAD=$(clang -print-file-name=libclang_rt.asan-x86_64.so 2>/dev/null || gcc -print-file-name=libasan.so 2>/dev/null)
            echo "LD_PRELOAD=$LD_PRELOAD"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            export DYLD_INSERT_LIBRARIES=$($(brew --prefix llvm)/bin/clang -print-file-name=libclang_rt.asan_osx_dynamic.dylib)
            echo "DYLD_INSERT_LIBRARIES=$DYLD_INSERT_LIBRARIES"
          fi
        fi
        python3 python/tests/test_csilk.py
        CSILK_ABI_PROBE_BIN="$PWD/build/test_python_abi" CSILK_REQUIRE_ABI_PROBE=1 python3 python/tests/test_abi_layout.py
        python3 python/tests/test_middleware_bindings.py
        python3 python/tests/test_test_context_compat.py
      env:
        ASAN_OPTIONS: detect_leaks=${{ runner.os == 'Linux' && '1' || '0' }}:symbolize=1:abort_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions

  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-lint-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-lint-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang clang-format clang-tidy \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev

    - name: Validate Mermaid diagrams
      run: python3 scripts/check_mermaid.py .

    - name: Check code formatting
      run: |
        cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --target check-format

    - name: Check version sync (CMake vs git tag)
      run: ./scripts/check_version_sync.sh

    - name: Check sync primitive abstraction (no raw pthread in src/)
      run: bash ./scripts/check_sync_primitives.sh

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug

    - name: clang-tidy
      run: cmake --build build --target tidy

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-fuzz-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-fuzz-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang-19 \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang-19 -DUSE_ASAN=ON -DUSE_FUZZER=ON

    - name: Build Fuzzers
      run: cmake --build build --target fuzz_test fuzz_yaml fuzz_url fuzz_headers fuzz_h2 fuzz_websocket fuzz_raft_rpc fuzz_mcp fuzz_sql_rewrite -j$(nproc)

    - name: Fuzz — fuzz_test (HTTP routing + query parsing)
      run: cd build && ./fuzz_test -max_total_time=120 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_test

    - name: Fuzz — fuzz_url (URL decoding)
      run: cd build && ./fuzz_url -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_url

    - name: Fuzz — fuzz_yaml (YAML config)
      run: cd build && ./fuzz_yaml -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_yaml

    - name: Fuzz — fuzz_headers (form parsing + headers)
      run: cd build && ./fuzz_headers -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict

    - name: Fuzz — fuzz_h2 (HTTP/2 session + frame decoding)
      run: cd build && ./fuzz_h2 -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_h2

    - name: Fuzz — fuzz_websocket (WebSocket handshake + frame decoding)
      run: cd build && ./fuzz_websocket -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_websocket

    - name: Fuzz — fuzz_raft_rpc (Raft RPC header + payload codecs)
      run: cd build && ./fuzz_raft_rpc -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_raft_rpc

    - name: Fuzz — fuzz_mcp (MCP JSON-RPC messages + frames)
      run: cd build && ./fuzz_mcp -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_mcp

    - name: Fuzz — fuzz_sql_rewrite (SQL placeholder rewriting)
      run: cd build && ./fuzz_sql_rewrite -max_total_time=60 -dict=${{ github.workspace }}/fuzz/fuzz.dict ${{ github.workspace }}/fuzz/corpus/fuzz_sql_rewrite

  arm64:
    name: ARM64 Cross-Compile
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Install cross-compilation toolchain
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        # Restrict default sources to amd64 to avoid 404s on arm64 package lists
        sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources
        
        # Add ports repository for arm64 architecture
        printf "%s\n" \
          "Types: deb" \
          "URIs: http://ports.ubuntu.com/ubuntu-ports/" \
          "Suites: noble noble-updates noble-backports noble-security" \
          "Components: main restricted universe multiverse" \
          "Architectures: arm64" \
          "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" | sudo tee /etc/apt/sources.list.d/ports.sources
        
        sudo dpkg --add-architecture arm64
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
          libyaml-dev:arm64 zlib1g-dev:arm64 libcurl4-openssl-dev:arm64 \
          libpq-dev:arm64 libsqlite3-dev:arm64 libuv1-dev:arm64

    - name: Configure (ARM64 cross-compile)
      env:
        PKG_CONFIG_LIBDIR: /usr/lib/aarch64-linux-gnu/pkgconfig
      run: |
        cmake -B build_arm64 -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_LIBRARY_ARCHITECTURE=aarch64-linux-gnu \
          -DCMAKE_FIND_ROOT_PATH="/usr/aarch64-linux-gnu;/" \
          -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
          -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

    - name: Build (ARM64)
      run: cmake --build build_arm64 -j$(nproc)

    - name: Verify binary architecture
      run: |
        ls -lh build_arm64/libcsilk*.a
        readelf -h build_arm64/libcsilk-runtime.a | grep -i -E "AArch64|ARM" || (echo "ERROR: binary is not ARM64" && exit 1)
        readelf -h build_arm64/libcsilk-base.a | grep -i -E "AArch64|ARM" || (echo "ERROR: binary is not ARM64" && exit 1)

  io_uring:
    name: io_uring compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-uring-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-uring-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev

    - name: Configure (libuv + io_uring)
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSILK_BUILD_SHARED=ON -DENABLE_OOM_TEST=ON

    - name: Build (libuv + io_uring)
      run: cmake --build build -j$(nproc)

    - name: Run tests with UV_USE_IO_URING=1
      run: UV_USE_IO_URING=1 ctest --test-dir build --timeout 60 --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions

    - name: Configure (native CSILK_USE_URING=ON + ASAN)
      run: >
        cmake -B build_uring -S .
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_COMPILER=clang
        -DUSE_ASAN=ON
        -DCSILK_BUILD_SHARED=ON
        -DENABLE_OOM_TEST=ON
        -DCSILK_USE_URING=ON

    - name: Build (native CSILK_USE_URING=ON)
      run: cmake --build build_uring -j$(nproc)

    - name: Run tests with native CSILK_USE_URING=ON
      run: ctest --test-dir build_uring --timeout 60 --output-on-failure
      env:
        ASAN_OPTIONS: detect_leaks=1:symbolize=1:abort_on_error=1
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions


  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-tsan-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-tsan-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DUSE_TSAN=ON -DENABLE_OOM_TEST=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run unit tests
      run: ctest --test-dir build -E test_integration --output-on-failure
      env:
        TSAN_OPTIONS: halt_on_error=1:print_suppressions=0:suppressions=${{ github.workspace }}/cmake/.tsan-suppressions
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/cmake/.lsan-suppressions

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build_bench/_deps
        key: ${{ runner.os }}-bench-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-bench-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev libuv1-dev wrk

    - name: Run benchmarks (save)
      run: ./scripts/run_benchmarks.sh --save

    - name: Compare with baseline
      if: github.event_name == 'pull_request'
      run: ./scripts/run_benchmarks.sh --compare

    - name: Regression check (PR only, fail on >5% regression)
      if: github.event_name == 'pull_request'
      run: ./scripts/run_benchmarks.sh --ci

    - name: Upload benchmark results
      uses: actions/upload-artifact@v6
      with:
        name: benchmark-results
        path: benchmarks/results/

  examples:
    name: Examples Smoke Test
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-examples-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-examples-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev \
          libpq-dev libsqlite3-dev curl libuv1-dev

    - name: Configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSILK_BUILD_SHARED=ON

    - name: Build examples
      run: cmake --build build --target example_server example_app example_tls example_db example_ai example_ai_workflow example_sse example_websocket -j$(nproc)

    - name: Smoke test — example_server
      run: |
        cd build
        ./example_server &
        SERVER_PID=$!
        sleep 2
        curl -fsS http://127.0.0.1:8080/ && echo " PASS" || echo " FAIL"
        kill $SERVER_PID 2>/dev/null || true
        wait $SERVER_PID 2>/dev/null || true

    - name: Smoke test — example_app
      run: |
        cd build
        ./example_app &
        APP_PID=$!
        sleep 2
        curl -fsS http://127.0.0.1:8080/api/v1/users && echo " PASS" || echo " FAIL"
        kill $APP_PID 2>/dev/null || true
        wait $APP_PID 2>/dev/null || true

  db_integration:
    name: "Database Drivers (Real Services: PG, MySQL, Redis, Mongo)"
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: csilk_user
          POSTGRES_PASSWORD: csilk_password
          POSTGRES_DB: csilk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: csilk_test
          MYSQL_USER: csilk_user
          MYSQL_PASSWORD: csilk_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v5

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: build/_deps
        key: ${{ runner.os }}-db-deps-${{ hashFiles('**/CMakeLists.txt', 'cmake/*.cmake') }}
        restore-keys: |
          ${{ runner.os }}-db-deps-

    - name: Install dependencies
      run: |
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        sudo apt-get install -y -o Acquire::Retries=3 \
          cmake clang \
          libyaml-dev zlib1g-dev libcurl4-openssl-dev libuv1-dev \
          libsqlite3-dev libpq-dev default-libmysqlclient-dev libhiredis-dev libmongoc-dev libbson-dev

    - name: Wait for database services
      run: |
        echo "Waiting for services to become ready..."
        timeout 60 bash -c 'until nc -z 127.0.0.1 5432; do sleep 1; done'
        timeout 60 bash -c 'until nc -z 127.0.0.1 3306; do sleep 1; done'
        timeout 60 bash -c 'until nc -z 127.0.0.1 6379; do sleep 1; done'
        timeout 60 bash -c 'until nc -z 127.0.0.1 27017; do sleep 1; done'
        echo "All database ports are open!"

    - name: Configure
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCSILK_BUILD_SHARED=ON \
          -DENABLE_OOM_TEST=ON \
          -DUSE_ASAN=ON

    - name: Build
      run: cmake --build build -j$(nproc)

    - name: Run Database Driver Real Connection Tests
      env:
        CSILK_TEST_POSTGRES_DSN: "host=127.0.0.1 port=5432 user=csilk_user password=csilk_password dbname=csilk_test"
        CSILK_TEST_POSTGRES_REQUIRED: "1"
        CSILK_TEST_MYSQL_DSN: "host=127.0.0.1;port=3306;user=csilk_user;password=csilk_password;dbname=csilk_test"
