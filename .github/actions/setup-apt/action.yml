name: Setup APT dependencies
description: Configure resilient APT timeouts and mirrors and install Ubuntu packages
inputs:
  packages:
    description: Space-separated list of APT packages to install
    required: true
  arm64_ports:
    description: Enable Ubuntu Ports arm64 multi-arch sources before updating
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install APT packages
      shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
        ENABLE_ARM64_PORTS: ${{ inputs.arm64_ports }}
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/apt-mirrors.txt 2>/dev/null || true

        if [ "${ENABLE_ARM64_PORTS}" = "true" ]; then
          # Restrict default sources to amd64 to avoid 404s on arm64 package lists
          sudo sed -i 's/Types: deb/Types: deb\nArchitectures: amd64/g' /etc/apt/sources.list.d/ubuntu.sources

          # Add ports repository for arm64 architecture
          printf "%s\n" \
            "Types: deb" \
            "URIs: http://ports.ubuntu.com/ubuntu-ports/" \
            "Suites: noble noble-updates noble-backports noble-security" \
            "Components: main restricted universe multiverse" \
            "Architectures: arm64" \
            "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" | sudo tee /etc/apt/sources.list.d/ports.sources >/dev/null

          sudo dpkg --add-architecture arm64
        fi

        sudo apt-get update -o Acquire::Retries=3
        # shellcheck disable=SC2086
        sudo apt-get install -y -o Acquire::Retries=3 --no-install-recommends ${APT_PACKAGES}
